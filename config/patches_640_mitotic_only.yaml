# 640px Patches - Mitotic Only Configuration
# MIDOG Dataset preparation for YOLO training
# Only mitotic figures will be included, non-mitotic figures will be ignored

# Patch settings
USE_PATCHES: true
PATCH_SIZE: 640
OVERLAP: 0

# Class settings
SINGLE_CLASS: true
MITOTIC_ONLY: true  # NEW FEATURE: Only include mitotic figures, ignore non-mitotic

# Dataset split settings
INCLUDE_TEST_SET: true
TRAIN_RATIO: 0.7
VAL_RATIO: 0.15

# Patch filtering settings
SKIP_EMPTY_PATCHES: true
OVERLAP_RATIO_THRESHOLD: 0.3

# File paths
MIDOG_JSON: "MIDOG++.json"
IMAGES_DIR: "datasets/midog_original/images" 